          <!-- Hero header — morphs in place as you scroll: photo/tagline
               fade, name/role/email/icons condense into a fixed strip. -->
          <div class="hero-shell">
            <div class="hero-placeholder" data-hero-placeholder></div>
            <header class="hero-header" data-hero-header>
              <div class="hero-photo">
                <img src="{{ '/assets/img/SohyunLee.png' | relative_url }}" alt="Sohyun Lee" />
              </div>
              <div class="hero-id">
                <h1 class="hero-name">Sohyun Lee</h1>
                <div class="hero-contact">
                  <a class="hero-role" href="https://cvlab.postech.ac.kr">Postdoctoral Researcher, POSTECH Computer Vision Lab</a>
                  <span class="hero-sep" aria-hidden="true">·</span>
                  <a class="hero-email" href="mailto:{{ site.email }}">{{ site.email }}</a>
                </div>
                <div class="hero-tagline">robust perception / vision-language-action / physical AI</div>
                <div class="hero-icons contact-icons">
                  {% include social.html %}
                </div>
              </div>
            </header>
          </div>

          <script>
            (function () {
              var header      = document.querySelector('[data-hero-header]');
              var placeholder = document.querySelector('[data-hero-placeholder]');
              if (!header || !placeholder) return;
              var natural = 0, pending = false, condensed = false;

              function measure() { natural = header.offsetHeight; }
              function apply(on) {
                if (on === condensed) return;
                condensed = on;
                if (on) {
                  placeholder.style.height = natural + 'px';
                  header.classList.add('is-condensed');
                } else {
                  header.classList.remove('is-condensed');
                  placeholder.style.height = '';
                }
              }
              function onScroll() {
                var y = window.scrollY || document.documentElement.scrollTop;
                apply(y > 40);
                pending = false;
              }
              window.addEventListener('scroll', function () {
                if (!pending) { requestAnimationFrame(onScroll); pending = true; }
              }, { passive: true });
              window.addEventListener('resize', function () {
                if (!condensed) measure();
              }, { passive: true });
              if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () { measure(); onScroll(); });
              }
              measure();
              onScroll();
            })();
          </script>
