          <!-- Hero header — sticks below the navbar as you scroll and
               morphs its own contents from a portrait card into a
               compact one-line strip. Same element, no swap. -->
          <div class="hero-shell">
            <div class="hero-sentinel" data-hero-sentinel aria-hidden="true"></div>
            <header class="hero-header" data-hero-header>
              <div class="hero-photo">
                <img src="{{ '/assets/img/SohyunLee.png' | relative_url }}" alt="Sohyun Lee" />
              </div>
              <div class="hero-id">
                <h1 class="hero-name">Sohyun Lee</h1>
                <div class="hero-contact">
                  <a class="hero-role" href="https://cvlab.postech.ac.kr">Postdoctoral Researcher, POSTECH Computer Vision Lab</a>
                  <span class="hero-sep" aria-hidden="true">·</span>
                  <a class="hero-email" href="mailto:{{ site.email }}">{{ site.email }}</a>
                </div>
                <div class="hero-tagline">robust perception / vision-language-action / physical AI</div>
                <div class="hero-icons contact-icons">
                  {% include social.html %}
                </div>
              </div>
            </header>
          </div>

          <script>
            (function () {
              var sentinel = document.querySelector('[data-hero-sentinel]');
              var header   = document.querySelector('[data-hero-header]');
              if (!sentinel || !header) return;

              if ('IntersectionObserver' in window) {
                var io = new IntersectionObserver(function (entries) {
                  entries.forEach(function (e) {
                    header.classList.toggle('is-condensed', !e.isIntersecting);
                  });
                }, { threshold: 0 });
                io.observe(sentinel);
              } else {
                var pending = false;
                function onScroll() {
                  header.classList.toggle('is-condensed', (window.scrollY || 0) > 30);
                  pending = false;
                }
                window.addEventListener('scroll', function () {
                  if (!pending) { requestAnimationFrame(onScroll); pending = true; }
                }, { passive: true });
                onScroll();
              }
            })();
          </script>
